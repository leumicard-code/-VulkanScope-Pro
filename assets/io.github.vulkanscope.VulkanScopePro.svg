<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d1d29"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22ffe2"/>
      <stop offset="55%" stop-color="#14c8ff"/>
      <stop offset="100%" stop-color="#ff48b0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#1e3c52" stroke-width="3"/>
  <!-- Etched CRT graticule -->
  <g stroke="#1b4657" stroke-width="1.2" opacity="0.65">
    <line x1="64" y1="20" x2="64" y2="108"/>
    <line x1="20" y1="64" x2="108" y2="64"/>
    <circle cx="64" cy="64" r="42" fill="none"/>
    <circle cx="64" cy="64" r="22" fill="none" stroke-dasharray="3 4"/>
  </g>
  <!-- 3D Waterfall silhouette -->
  <path d="M 22 86 L 34 74 L 44 80 L 54 52 L 64 68 L 76 44 L 88 66 L 98 60 L 106 86 Z"
        fill="#11b8d8" opacity="0.18"/>
  <!-- Glowing CRT Phosphor Waveform -->
  <path d="M 22 64 C 34 32, 46 96, 64 64 C 82 32, 94 96, 106 64"
        fill="none" stroke="url(#cyanGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 22 64 C 34 32, 46 96, 64 64 C 82 32, 94 96, 106 64"
        fill="none" stroke="#eaffff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
